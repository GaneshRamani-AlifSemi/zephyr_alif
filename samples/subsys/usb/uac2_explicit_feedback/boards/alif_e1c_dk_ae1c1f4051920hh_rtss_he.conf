CONFIG_I2C=y
CONFIG_WM8904=y
CONFIG_AUDIO=y
CONFIG_AUDIO_CODEC=y

CONFIG_MAIN_STACK_SIZE=16384
CONFIG_ISR_STACK_SIZE=16384
CONFIG_PRIVILEGED_STACK_SIZE=4096
CONFIG_IDLE_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_UDC_DWC3_STACK_SIZE=4096
CONFIG_USBD_THREAD_STACK_SIZE=4096

# Match the USB/I2S slab depth so packets are not dropped before I2S starts.
CONFIG_I2S_DW_TX_BLOCK_COUNT=16
CONFIG_UDC_DWC3_MAX_QMESSAGES=32
